  <body>
    <main id="demo">
      <noscript>
        <h1>Polyhedral</h1>
        <p>
          An FFGL source that throws polyhedral dice onto the table, and an
          effect that throws them over a clip. The d4, d6, d8, d10, d12, d20 and
          the d100's pair tumble with proper rigid-body physics, bounce off the
          frame's edges and each other, and land on a random result or on the
          total you set, at exactly the Roll Time you set. Every die is
          face-transitive, so the throw is simulated straight and the die is
          then drawn turned by whichever symmetry puts the wanted number on top:
          the motion is the physics', and only the paint has turned. Numbers in
          any installed font, and faces in marble, pearl, metal, gem, stone,
          wood, galaxy, a picture or a wireframe.
        </p>
        <p>
          This demo runs the plugin's own C++, compiled to WebAssembly, and its
          shaders in your browser, so it needs JavaScript and WebGL2. The plugin
          itself, its source and its downloads are on
          <a href="https://github.com/stoatworks-labs/polyhedral">its repository</a>.
        </p>
